name: Rebuild catalogue

on:
  schedule:
    - cron: "0 3 * * 1"  # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rebuild bundled catalogue
        env:
          NBB_LOG_LEVEL: INFO
        run: mcp-nbb-build-catalog --force

      - name: Check for drift
        id: diff
        run: |
          if git diff --quiet src/nbb_mcp/data/catalog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat src/nbb_mcp/data/catalog | tail -10
          fi

      # PRs opened with GITHUB_TOKEN do not trigger the CI workflow, so the
      # refreshed catalogue is validated here before the PR exists.
      - name: Validate refreshed catalogue
        if: steps.diff.outputs.changed == 'true'
        run: |
          pytest -q --strict-markers
          pytest -q -m e2e

      - name: Open PR with refreshed catalogue
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/refresh-catalog
          commit-message: "chore: refresh NBB catalogue snapshot"
          title: "chore: refresh NBB catalogue snapshot"
          body: |
            Automated refresh of the enriched dataflow catalogue bundled under
            `src/nbb_mcp/data/catalog/`.

            Generated by the weekly `build-catalog.yml` workflow. The full test
            suite (unit + e2e) already passed on the refreshed catalogue in that
            run; CI does not re-trigger on PRs opened with `GITHUB_TOKEN`.
          add-paths: src/nbb_mcp/data/catalog/
          delete-branch: true
