name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify bundled catalogue matches its index
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          d = pathlib.Path("src/nbb_mcp/data/catalog")
          idx = json.loads((d / "_index.json").read_text())
          fiches = [p for p in d.glob("*.json") if not p.name.startswith("_")]
          assert len(fiches) == idx["dataflow_count"] == len(idx["flows"]), (
              f"{len(fiches)} fiches on disk vs index {idx['dataflow_count']}"
          )
          assert len(fiches) > 100, f"catalogue looks truncated: {len(fiches)} fiches"
          print(f"catalogue OK: {len(fiches)} fiches")
          PY

      - name: Run unit + integration tests
        run: pytest -q --strict-markers

      - name: Run E2E stdio tests
        run: pytest -q -m e2e

  lowest-deps:
    name: pytest lowest direct deps / py3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install with the declared lower bounds
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[dev]"
      - run: pytest -q --strict-markers

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: [test, lint, lowest-deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Verify bundled catalogue in wheel
        run: |
          python - <<'PY'
          import glob, json, pathlib, zipfile
          expected = json.loads(
              pathlib.Path("src/nbb_mcp/data/catalog/_index.json").read_text()
          )["dataflow_count"]
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
          fiches = [
              n for n in names
              if n.startswith("nbb_mcp/data/catalog/") and n.endswith(".json")
              and not n.rsplit("/", 1)[-1].startswith("_")
          ]
          assert len(fiches) == expected, f"wheel bundled {len(fiches)} fiches, index says {expected}"
          assert "nbb_mcp/data/catalog/_index.json" in names, "_index.json missing from wheel"
          print(f"wheel OK: {wheel} with {len(fiches)} fiches")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
